<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PM Workbench</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#FBFAF7;--card:#fff;--ink:#1B2430;--mute:#5B6675;--line:#E4E7EB;--rule:#D6DBE1;--acc:#0F6E63;--acc2:#E3F1EE;--acc-ink:#0B5148;
 --p1:#B3261E;--p2:#C2601A;--p3:#9A7209;--p4:#7A8593;--ok:#1E7A46;--warn:#9A5B00;--bad:#B3261E;--draft:#6B4FA3;--ai:#FFF6E0;--ai-b:#E6C77A;--ai-ink:#7A4E00;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:13.5px/1.45 "IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
h1,h2,h3,h4,.serif{font-family:"Newsreader","Iowan Old Style",Georgia,serif;font-weight:500;letter-spacing:-.005em}
h3{font-size:19px;margin:0 0 8px}h4{font-size:16px;margin:16px 0 6px}
header{display:flex;align-items:center;gap:14px;padding:9px 22px;background:var(--bg);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0 10px 0 0;color:var(--ink)}
nav a{padding:6px 10px;border-radius:5px;color:var(--mute);cursor:pointer;text-decoration:none;font-weight:500}
nav a.on{color:var(--acc-ink);background:var(--acc2)}
.sp{flex:1}.mute{color:var(--mute)}.small{font-size:12px}
button,.btn{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--rule);background:#fff;border-radius:5px;cursor:pointer;color:var(--ink);text-decoration:none;line-height:1.3}
button:hover,.btn:hover{border-color:#aeb7c1}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.pri:hover{background:var(--acc-ink)}
button.ai{background:var(--ai);border-color:var(--ai-b);color:var(--ai-ink)}button.ai::before{content:"✦ "}
button.dng{color:var(--bad)}button:disabled{opacity:.45;cursor:default}button.small,.btn.small{padding:3px 8px;font-size:12px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
main{padding:14px 22px 40px;max-width:1600px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
.bar-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:8px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0;background:#fff;z-index:1}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}tr:hover td{background:#F7F8F6}
.tablewrap{background:#fff;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overflow:auto;max-height:calc(100vh - 190px)}
td select,td input[type=text]{font:inherit;font-size:12.5px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);width:100%}
td select{-webkit-appearance:none;appearance:none;padding-right:16px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M0 0l4 5 4-5z' fill='%235B6675'/></svg>") no-repeat right 5px center;min-width:46px}
td select:hover,td input:hover{border-color:#aeb7c1}td select.blank{color:#9aa1ab}
.badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11.5px;font-weight:600;color:#fff;background:var(--p4);letter-spacing:.01em}
.P1{background:var(--p1)}.P2{background:var(--p2)}.P3{background:var(--p3)}.P4{background:var(--p4)}
.gap{color:var(--bad);font-weight:600;font-size:11.5px}.draft{background:var(--draft)}
.diff{font-size:11px;color:var(--warn)}
a{color:var(--acc-ink)}a.key{color:var(--acc-ink);text-decoration:none;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=text],textarea,select.f{font:inherit;padding:6px 8px;border:1px solid var(--rule);border-radius:5px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:80px;line-height:1.5}label.f{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.modal{position:fixed;inset:0;background:rgba(27,36,48,.42);display:flex;align-items:center;justify-content:center;z-index:20}
.modal .box{background:#fff;border-radius:8px;padding:22px 24px;max-width:720px;width:92%;max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(27,36,48,.18)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:580px;background:#fff;border-left:1px solid var(--rule);box-shadow:-12px 0 32px rgba(27,36,48,.10);padding:20px 22px;overflow:auto;z-index:10}
pre{background:#F3F4F1;padding:10px;border-radius:5px;font-size:12px;overflow:auto;white-space:pre-wrap}
.idea{border:1px solid var(--line);border-radius:5px;padding:9px 11px;margin-bottom:6px;background:#fff}
.idea h4{margin:0 0 3px;font-size:14px;font-family:inherit;font-weight:600}.idea p{margin:0;color:var(--mute);font-size:12.5px}
.stage{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:3px;background:#EEF0F3;color:#3a4250;white-space:nowrap}
.stage.reviewed{background:#E3F0FF;color:#1b4fa8}.stage.validated{background:#E3F1EE;color:var(--acc-ink)}.stage.published{background:#EFE7FB;color:#5b3a9a}.stage.in-pr{background:#FFF3E0;color:#9a5b00}
.stage.failed,.stage.BLOCKED{background:#FBEAE8;color:var(--bad)}.stage.done,.stage.APPROVED,.stage.PASS{background:#E3F1EE;color:var(--acc-ink)}.stage.partial,.stage.REQUIRES_MANUAL_REVIEW{background:#FFF3E0;color:#9a5b00}.stage.FAIL{background:#FBEAE8;color:var(--bad)}
.chips{display:flex;gap:3px;flex-wrap:nowrap}.chip{width:auto;min-width:22px;padding:0 5px;height:18px;border-radius:3px;background:#EEF0F3;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#7A8593;cursor:default}
.chip.done{background:var(--acc);color:#fff}.chip.partial{background:#F0B45A;color:#5a3a00}.chip.failed{background:var(--bad);color:#fff}.chip.skipped{background:#fff;border:1px dashed #aeb7c1;color:#aeb7c1}.chip.optional{background:#F3F4F1;color:#c2c8ce}.chip.missing{background:#fff;border:1px solid var(--bad);color:var(--bad)}
.ready{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:3px;background:#E3F1EE;color:var(--acc-ink)}.notready{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:3px;background:#EEF0F3;color:#5B6675}
.steprow{display:grid;grid-template-columns:auto minmax(150px,1fr) 2fr auto;gap:10px;align-items:start;padding:7px 0;border-top:1px dashed var(--line);font-size:12.5px}.steprow .ev{min-width:0}.steprow .ev a{display:block;color:var(--acc-ink);text-decoration:none;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.steprow .ev a:hover{text-decoration:underline}
.dorchk{display:inline-block;width:14px;text-align:center;font-weight:700}.dorchk.y{color:var(--ok)}.dorchk.n{color:var(--bad)}
.themerow{padding:16px 0 14px;border-bottom:1px solid var(--line)}.themerow:last-child{border-bottom:0}
.themerow .rank{width:30px;font-family:"Newsreader",Georgia,serif;font-size:18px;color:var(--mute);text-align:right;padding-right:6px}
.tname{font-size:12px;color:var(--mute);font-weight:500}
.obj{font-family:"Newsreader","Iowan Old Style",Georgia,serif;font-size:21px;line-height:1.3;margin:2px 0 8px;color:var(--ink);max-width:62ch;outline:none;border-radius:3px}
.obj:hover{background:#F7F8F6}.obj:focus{background:#fff;box-shadow:0 0 0 2px var(--acc2)}.obj.empty{color:#9aa1ab;font-style:italic}
.tabs{display:none}.tabs.on{display:block}
.mtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 12px}.mtabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 12px;color:var(--mute)}.mtabs button.on{border-bottom-color:var(--acc);color:var(--acc-ink);font-weight:600}
.chartbox{height:260px}
.warn{background:var(--ai);border:1px solid var(--ai-b);padding:8px 10px;border-radius:5px;font-size:12.5px;color:var(--ai-ink)}
.err{background:#FBEAE8;border:1px solid #EFB7B1;padding:8px 10px;border-radius:5px;color:var(--bad);font-size:12.5px}
.chk{width:15px;height:15px;accent-color:var(--acc)}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#F3F4F1;padding:1px 5px;border-radius:4px}
.bar{height:6px;background:#E9ECE8;border-radius:3px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--acc)}
.bar.ahead i{background:var(--ok)}.bar.behind i{background:var(--bad)}.bar.measuring i{background:var(--draft)}
.hc{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:3px;background:#EEF0F3;color:#3a4250;white-space:nowrap}
.hc.ahead{background:#E3F1EE;color:var(--ok)}.hc.on_track{background:#E3F0FF;color:#1b4fa8}.hc.behind{background:#FBEAE8;color:var(--bad)}.hc.measuring{background:#EFE7FB;color:#5b3a9a}
.krrow{display:grid;grid-template-columns:minmax(180px,2fr) minmax(150px,1fr) 100px 110px auto;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:12.5px}
.krrow>div:first-child{min-width:0}
.drawer .krrow{grid-template-columns:minmax(0,1fr) auto auto;row-gap:4px}.drawer .krrow .bar{grid-column:1/2}.drawer .krrow .spark{display:none}
.bar-tools select.f{max-width:260px}
td.nowrap{white-space:nowrap}
.spark{width:110px;height:22px}
.retro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.fact{background:#F7F8F6;border-radius:5px;padding:7px 9px}.fact b{display:block;font-size:18px;font-family:"Newsreader",Georgia,serif;font-weight:500}.fact span{font-size:11.5px;color:var(--mute)}
.verdict{font-weight:700}.verdict.hit{color:var(--ok)}.verdict.miss{color:var(--bad)}.verdict.partial{color:var(--warn)}
.empty{padding:22px 4px;color:var(--mute);font-size:13px;max-width:44ch;line-height:1.5}
.meta{color:var(--mute);font-size:12px}.meta span+span::before{content:"";display:inline-block;width:14px}
.actions{display:flex;gap:4px;flex-wrap:nowrap;white-space:nowrap}
td.num{text-align:right}
.ev{display:inline-block;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:3px;background:#EEF0F3;color:#3a4250;margin-right:3px;white-space:nowrap}
.ev.user_data{background:#E3F1EE;color:var(--acc-ink)}.ev.customer{background:#E3F0FF;color:#1b4fa8}.ev.prospect{background:#EFE7FB;color:#5b3a9a}.ev.support{background:#FFF3E0;color:#9a5b00}.ev.competitor{background:#F3F4F1;color:#5B6675}.ev.internal{background:#F3F4F1;color:#5B6675}
.valscore{font-weight:600}.valscore.low{color:var(--mute)}
.evrow{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px dashed var(--line);font-size:12.5px}.evrow .note{flex:1}
.stale{display:inline-block;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:3px;background:#FFF3E0;color:#9a5b00;white-space:nowrap;margin-left:4px}
.amber{color:var(--warn)}
tr.aged td{color:var(--mute)}
#tab-today .card h4{font-family:inherit;font-size:14px;font-weight:600}#tab-today .card>div:last-child{max-height:380px;overflow:auto}
.legend{line-height:1.8}.legend .chip{vertical-align:middle}
</style>
</head>
<body>
<header>
  <h1>PM Workbench</h1>
  <nav id="nav"></nav>
  <span class="sp"></span>
  <span id="sync" class="small mute"></span>
  <button class="small" onclick="pull(this)">Pull from Jira</button>
  <button class="small" title="Glossary: PM Journey terms used in this app" onclick="glossary()">?</button>
  <span id="aimode" class="small mute"></span>
</header>
<main>
  <div id="tab-today" class="tabs"></div>
  <div id="tab-backlog" class="tabs"></div>
  <div id="tab-themes" class="tabs"></div>
  <div id="tab-journey" class="tabs"></div>
  <div id="tab-inbox" class="tabs"></div>
  <div id="tab-prds" class="tabs"></div>
  <div id="tab-retros" class="tabs"></div>
  <div id="tab-settings" class="tabs"></div>
</main>
<div id="overlay"></div>
<script>
const TABS=[["today","Today"],["inbox","Inbox"],["themes","Objectives"],["journey","Journey"],["prds","Artifacts: PRDs & HLDs"],["backlog","Backlog"],["retros","Retros"],["settings","Settings"]];
let JF={q:"",bepic:"",notready:false,owner:"",period:""};
let RF="pending", openTheme=null, MK=null;
let S=null, tab=localStorage.tab||"today", F={team:"",theme:"",bepic:"",gap:"",q:"",drafts:true}, sel=new Set(), chart=null;
const jp=e=>e.is_draft?null:(e.priority_cur??null);
const $=s=>document.querySelector(s), esc=s=>(s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(m,u,b,raw){const o={method:m,headers:{}};if(b instanceof FormData)o.body=b;else if(b!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(b)}
 const r=await fetch(u,o);if(!r.ok){let d;try{d=(await r.json()).detail}catch(e){d=r.statusText}throw new Error(d)}return raw?r:r.json()}
async function load(){S=await api("GET","/api/state");if(!S.config.portfolio_team_ids||!Object.keys(S.config.portfolio_team_ids).length){if(tab!=="settings")toast("First run: finish setup in Settings");tab="settings"}render()}
function go(t){tab=t;localStorage.tab=t;render()}
function render(){$("#nav").innerHTML=TABS.map(([k,l])=>`<a class="${tab===k?'on':''}" onclick="go('${k}')">${l}</a>`).join("");
 TABS.forEach(([k])=>$("#tab-"+k).classList.toggle("on",tab===k));
 const ls=S.meta.last_sync;$("#sync").textContent=ls?`Jira synced ${ago(ls)}`:"Jira not synced yet";$("#sync").className="small "+(stale(ls,1)?"amber":"mute");$("#sync").title=S.meta.last_sync_error||(stale(ls,1)?"Jira data is more than a day old — Pull from Jira":"");
 const m=S.config.claude_mode;$("#aimode").textContent=`AI: ${m}`;$("#aimode").title=`${S.runs_today} AI run${S.runs_today===1?"":"s"} today`;
 ({today:rToday,backlog:rBacklog,themes:rThemes,journey:rJourney,inbox:rInbox,prds:rPrds,retros:rRetros,settings:rSettings})[tab]()}
const pct=p=>p==null?"–":Math.round(p*100)+"%";
const fmt=v=>v==null?"–":(Number.isInteger(v)?v:+v.toFixed(2));
function bar(p,h){return `<div class="bar ${h||''}" title="${pct(p)}"><i style="width:${Math.round((p||0)*100)}%"></i></div>`}
function hchip(h){const l={ahead:"ahead",on_track:"on track",behind:"behind",measuring:"released · measuring",unmeasured:"unmeasured"}[h]||h;return `<span class="hc ${h}">${l}</span>`}
const EVL=k=>(S.evidence_types.find(t=>t.key===k)||{label:k}).label;
const EVS={user_data:"Data",customer:"Customer",prospect:"Prospect",support:"Support",competitor:"Competitor",internal:"Internal"};
function evChips(items){if(!items||!items.length)return `<span class="small mute">no evidence</span>`;const c={};items.forEach(e=>c[e.type]=(c[e.type]||0)+1);return Object.entries(c).map(([k,n])=>`<span class="ev ${k}" title="${EVL(k)}">${EVS[k]||k}${n>1?" ×"+n:""}</span>`).join("")}
function valCell(e){const v=e.validation;const cls=v<=1.5?"low":"";return `<span class="valscore ${cls}" title="Validation ${v} (${e.val_override!=null?"manual override":"from evidence"})">${v}</span><div>${evChips(e.evidence)}</div>`}
function evSection(ref,items,opts){opts=opts||{};return `<div id="evsec">
 <div class="row" style="margin:6px 0">${evChips(items)}<span class="sp"></span><button class="small" onclick="evForm('${ref}')">Add evidence</button></div>
 ${(items||[]).map(e=>`<div class="evrow"><span class="ev ${e.type}">${EVS[e.type]||e.type}</span><div class="note">${esc(e.note)}${e.link?` <a href="${esc(e.link)}" target="_blank">link</a>`:""}<div class="small mute">${e.occurred_at||""}${evFrom(e,ref)}</div></div><button class="small" onclick="evForm('${ref}',${e.id})">Edit</button><button class="small dng" title="Remove" onclick="api('DELETE','/api/evidence/${e.id}').then(load).then(()=>${opts.after||"null"})">✕</button></div>`).join("")}
 </div>`}
function evFrom(e,ref){const s=e.source_id&&S.sources.find(x=>x.id===e.source_id);const i=e.ref!==ref&&String(e.ref).startsWith("idea:")&&S.ideas.find(x=>x.id==e.ref.slice(5));return (s?` · from ${esc(s.filename)}`:"")+(i?` · idea: ${esc(i.title)}`:"")}
function groupEv(gid){return [].concat(S.evidence["group:"+gid]||[],...S.ideas.filter(i=>i.group_id===gid).map(i=>S.evidence["idea:"+i.id]||[]))}
const EVO=new Set();
function evToggle(ref){EVO.has(ref)?EVO.delete(ref):EVO.add(ref);rInbox()}
function evInline(ref,items){items=items||[];const o=EVO.has(ref);return `<div class="row" style="margin-top:4px"><a href="#" class="small" style="text-decoration:none" onclick="evToggle('${ref}');return false">${o?"▾":"▸"} Evidence (${items.length})</a>${o?"":(items.length?evChips(items):"")+`<a href="#" class="small" onclick="evForm('${ref}');return false">add evidence</a>`}</div>${o?evSection(ref,items):""}`}
function evFind(id){return Object.values(S.evidence).flat().concat(S.epics.flatMap(e=>e.evidence||[])).find(e=>e.id===id)}
function evForm(ref,id){const e=id?evFind(id):null;modal(`<h3>${e?"Edit":"Add"} evidence</h3><div class="small mute">Where did the signal for this come from? Breadth of sources raises the Validation score more than volume; competitor-only stays low.</div>
 <label class="f">Source type</label><select class="f" id="ev_type">${S.evidence_types.map(t=>`<option value="${t.key}" ${e&&e.type===t.key?"selected":""}>${esc(t.label)}</option>`).join("")}</select>
 <label class="f">What was said or observed</label><textarea id="ev_note" placeholder="e.g. 3 of 5 CAB customers asked for bulk delete; Pendo shows 14% of sessions open history">${e?esc(e.note):""}</textarea>
 <div class="grid2"><div><label class="f">Link (optional)</label><input type="text" id="ev_link" value="${e?esc(e.link||""):""}" placeholder="Wiki, analytics, call recording, Jira…"></div><div><label class="f">Date</label><input type="text" id="ev_date" value="${e?esc(e.occurred_at||""):new Date().toISOString().slice(0,10)}"></div></div>
 <div class="row" style="margin-top:12px"><button class="pri" onclick="evSave('${ref}',${id||0})">${e?"Save":"Add"}</button><button onclick="closeModal()">Cancel</button></div><div id="everr"></div>`)}
async function evSave(ref,id){try{await api(id?"PUT":"POST","/api/evidence"+(id?"/"+id:""),{ref,type:$("#ev_type").value,note:$("#ev_note").value,link:$("#ev_link").value||null,occurred_at:$("#ev_date").value||null});closeModal();await load();
 if(ref.startsWith("draft:"))draftForm(S.drafts.find(d=>d.id==ref.split(":")[1]));else if(ref.startsWith("idea:")||ref.startsWith("group:")){EVO.add(ref);rInbox()}else openEpic(ref)}catch(e){$("#everr").innerHTML=`<div class="err">${esc(e.message)}</div>`}}
function spark(snaps,kr){if(!snaps||snaps.length<2)return `<span class="small mute">${snaps&&snaps.length?fmt(snaps[0][1]):""}</span>`;
 const vs=snaps.map(s=>s[1]);const lo=Math.min(...vs,kr.baseline??Infinity,kr.target??Infinity),hi=Math.max(...vs,kr.baseline??-Infinity,kr.target??-Infinity);const W=110,H=22;
 const pts=vs.map((v,i)=>`${(i/(vs.length-1))*W},${H-2-((v-lo)/((hi-lo)||1))*(H-4)}`).join(" ");
 const ty=H-2-(((kr.target??lo)-lo)/((hi-lo)||1))*(H-4);
 return `<svg class="spark" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="#c9d3e6" stroke-dasharray="3 2"/><polyline fill="none" stroke="#2f5fd0" stroke-width="1.5" points="${pts}"/></svg>`}
function ago(iso){const s=(Date.now()-new Date(iso))/1000;return s<90?"just now":s<5400?Math.round(s/60)+" min ago":s<172800?Math.round(s/3600)+" h ago":Math.round(s/86400)+" d ago"}
const DAY=864e5;function stale(iso,days){return !iso||(Date.now()-new Date(iso))>days*DAY}
function staleBadge(iso,days,what){return stale(iso,days)?`<span class="stale" title="${what} ${iso?ago(iso):"never"} (threshold ${days} d)">${iso?"stale":"never"}</span>`:""}
function busy(btn,p){if(!btn||!btn.textContent)return Promise.resolve(p);const t=btn.textContent;btn.disabled=true;btn.textContent=t.replace(/…$/,"")+"…";return Promise.resolve(p).finally(()=>{if(document.body.contains(btn)){btn.disabled=false;btn.textContent=t}})}
function drawerHead(title,badges,backFn){return `<div class="row">${badges||""}<span class="sp"></span>${backFn?`<button class="small" onclick="${backFn}">← back</button>`:""}<button onclick="closeModal()" title="Close (Esc)">✕</button></div><h3 style="margin:8px 0">${title}</h3>`}
function toast(msg,bad){const d=document.createElement("div");d.className=bad?"err":"warn";d.style.cssText="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),bad?6000:3000)}
function modal(html){$("#overlay").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box">${html}</div></div>`}
function closeModal(){$("#overlay").innerHTML=""}
function drawer(html){$("#overlay").innerHTML=`<div class="drawer">${html}</div>`}

const selOpt=(v,ref,f,opts)=>`<select class="${v?'':'blank'}" onchange="score('${ref}','${f}',this.value)"><option value="">–</option>${opts.map(([a,b])=>`<option value="${a}" ${v==a?'selected':''}>${b}</option>`).join("")}</select>`;

async function score(ref,f,v){const e=S.epics.find(x=>x.ref===ref);const b={theme_id:e.theme_id,sv:e.sv,ui:e.ui,urg:e.urg,conf:e.conf,effort:e.effort,park:e.park,raise_p1:e.raise_p1,notes:e.notes};
 b.val_override=e.val_override;b[f]=v===""?null:(["sv","ui","urg","conf","theme_id","val_override"].includes(f)?+v:v);try{await api("PUT","/api/scores/"+encodeURIComponent(ref),b);await load()}catch(err){toast(err.message,1)}}

  <label><input type="checkbox" ${F.gap?'checked':''} onchange="F.gap=this.checked;rBacklog()"> Needs info only (${gaps})</label>
  <label><input type="checkbox" ${F.drafts?'checked':''} onchange="F.drafts=this.checked;rBacklog()"> show drafts</label>
  <span class="sp"></span>
  <span class="meta"><span>${n} scored</span><span>${diffs===0?"matches Jira priorities":`${diffs} priority difference${diffs===1?'':'s'} from Jira`}</span></span>

 </div>

  ${eps.map(e=>{const r=e.ref;const jp_=jp(e);const prd=e.prds[0];return `<tr>

 </tbody></table></div>
 <div class="grid2" style="margin-top:16px"><div class="card"><h4 style="margin-top:0">Value against effort</h4><div class="small mute">Weighted value before the effort divisor. Hover a point for the epic.</div><div class="chartbox"><canvas id="scatter"></canvas></div></div>
 <div class="card"><h4 style="margin-top:0">Already in flight</h4><div class="small mute">Committed work, shown for context and left out of the P1–P4 bands.</div>
  <table><tbody>${S.committed.slice(0,40).map(c=>`<tr><td><a class="key" target="_blank" href="${esc(c.url)}">${c.key}</a></td><td>${esc(c.summary)}</td><td class="small mute">${esc(c.status)}</td><td class="small">${esc(c.priority||"")}</td></tr>`).join("")}</tbody></table></div></div>`;
 drawScatter(eps.filter(e=>e.score!=null))}
function drawScatter(eps){const ctx=$("#scatter");if(!ctx)return;if(chart)chart.destroy();
 const col={P1:"#c62828",P2:"#ef6c00",P3:"#f9a825",P4:"#8e9aaf"};

  options:{maintainAspectRatio:false,scales:{x:{title:{display:true,text:"Effort (S=1 M=2 L=3)"},min:.5,max:3.5,ticks:{stepSize:1}},y:{title:{display:true,text:"Weighted value"},min:1,max:5}},
  plugins:{tooltip:{callbacks:{label:c=>`${c.raw.e.key} #${c.raw.e.rank} ${c.raw.e.summary.slice(0,50)}`}}}}})}

 if(e.is_draft){return draftForm(S.drafts.find(d=>d.id==ref.split(":")[1]))}
 drawer(`${drawerHead(esc(e.summary),`<a class="key" target="_blank" href="${esc(e.url)}">${e.key}</a><span class="badge ${e.priority||''}">${e.priority||"–"}</span>`)}

 <h4>Key Results <span class="small mute">(${S.period?S.period.name:"no period"})</span></h4>${krSection(e.key)}

const isThemeKey=k=>String(k).startsWith("theme:");
function okrOf(key){if(isThemeKey(key)){const t=S.okr.themes[key.slice(6)]||{};return {krs:t.krs||[],progress:t.krs&&t.krs.length?t.progress:null,health:t.krs&&t.krs.length?t.health:"unmeasured"}}return S.okr.epics[key]||{krs:[],progress:null,health:"unmeasured"}}
function krAfter(key){if(isThemeKey(key)){if(tab==="themes")rThemes()}else if(tab==="backlog")openEpic(key)}
function krSection(key){const o=okrOf(key);const th=isThemeKey(key);
 return `<div class="row" style="margin:6px 0">${th?`<span class="small mute">Objective-level key results${o.krs.length?" (drive the objective's progress instead of the epic mean)":""}</span>`:`${bar(o.progress,o.health)}<b>${pct(o.progress)}</b>${hchip(o.health)}`}<span class="sp"></span>
  <button class="small" onclick="krForm('${key}')">${th?"+ Key result":"Add key result"}</button>${th?"":`<button class="ai small" onclick="suggestKrs('${key}')">Suggest key results</button>`}${o.krs.length&&!th?`<button class="small" onclick="pushOutcome('${key}')" title="Write the key results into the epic's Jira Outcome field">Write to Jira Outcome</button>`:""}</div>
  ${o.krs.map(k=>`<div class="krrow"><div><b>${esc(k.title)}</b><div class="meta"><span>${k.source==="manual"?"entered by hand":esc(k.metric_key)}${k.unit?" in "+esc(k.unit):""}</span><span>${k.direction==="down"?"lower is better":"higher is better"}</span>${k.current_at?`<span>as of ${k.current_at}</span>`:""}${k.owner?`<span>owner ${esc(k.owner)}</span>`:""}${k.due?`<span>due ${esc(k.due)}</span>`:""}</div></div>
   <div class="small">${fmt(k.baseline)} → <b>${fmt(k.current)}</b> → ${fmt(k.target)}</div>${bar(k.progress)}<div>${spark(k.snapshots,k)}</div>
   <div class="actions">${k.source==="manual"?`<button class="small" onclick="krReading(${k.id})" title="Record a reading">Record</button>`:""}<button class="small" onclick="krForm('${key}',${k.id})">Edit</button><button class="small dng" title="Delete key result" onclick="if(confirm('Delete this key result?'))api('DELETE','/api/krs/${k.id}').then(load).then(()=>krAfter('${key}'))">✕</button></div></div>`).join("")||(th?"":`<div class="empty" style="padding:8px 0">No key results yet. Add one, or let AI suggest results tied to your dashboard metrics.</div>`)}`}
async function metricKeys(){if(!MK)MK=await api("GET","/api/metrics/keys");return MK}
async function krForm(key,kid,pre){const mk=await metricKeys();const k=kid?okrOf(key).krs.find(x=>x.id===kid):Object.assign({title:"",source:"baselines_jsonl",metric_key:"",direction:"up",unit:"",baseline:"",target:"",current:"",notes:"",owner:"",due:""},pre||{});
 if(!kid&&!(mk[k.source]||[]).length)k.source="manual";KRMK=mk;
 const opts=(src)=>(mk[src]||[]).map(m=>`<option ${k.metric_key===m?'selected':''}>${m}</option>`).join("");
 modal(`<h3>${kid?"Edit":"New"} Key Result <span class="small mute">${isThemeKey(key)?"objective · "+esc((S.themes.find(t=>t.id==key.slice(6))||{}).name||""):key}</span></h3>
 <label class="f">Title</label><input type="text" id="k_title" value="${esc(k.title)}" placeholder="e.g. Raise help rate for document questions to 95%" oninput="krLint()">
 <div class="grid2"><div><label class="f">Where readings come from</label><select class="f" id="k_source" onchange="krSrc()">${KR_SOURCES.map(([v,l])=>`<option value="${v}" ${k.source===v?'selected':''}>${l}</option>`).join("")}</select></div>
 <div id="k_metricwrap"><label class="f">Metric to track</label><select class="f" id="k_metric">${k.source==="manual"?"":opts(k.source)}</select></div></div>
 <div id="k_srchint" class="small mute" style="margin-top:4px"></div>
 <div class="grid3"><div><label class="f">Baseline</label><input type="text" id="k_base" value="${k.baseline??""}" placeholder="auto from source if blank" oninput="krLint()"></div><div><label class="f">Target</label><input type="text" id="k_target" value="${k.target??""}" oninput="krLint()"></div><div><label class="f">Current (manual only)</label><input type="text" id="k_cur" value="${k.current??""}"></div></div>
 <div class="grid2"><div><label class="f">Direction</label><select class="f" id="k_dir" onchange="krLint()"><option value="up" ${k.direction==="up"?"selected":""}>higher is better</option><option value="down" ${k.direction==="down"?"selected":""}>lower is better</option></select></div><div><label class="f">Unit</label><input type="text" id="k_unit" value="${esc(k.unit||"")}" placeholder="%, s, users" oninput="krLint()"></div></div>
 <div class="grid2"><div><label class="f">Owner</label><input type="text" id="k_owner" value="${esc(k.owner||"")}" placeholder="who reports this reading"></div><div><label class="f">Due</label><input type="text" id="k_due" value="${esc(k.due||"")}" placeholder="YYYY-MM-DD${S.period?" (period ends "+S.period.end+")":""}"></div></div>
 <label class="f">Notes</label><input type="text" id="k_notes" value="${esc(k.notes||"")}">
 <div id="krlint" class="small" style="margin-top:8px"></div>
 <div class="row" style="margin-top:12px"><button class="pri" onclick="krSave('${key}',${kid||0})">Save</button><button onclick="closeModal()">Cancel</button><span class="small mute">Owner and due stay in the workbench; the Jira Outcome block carries metric, baseline and target only.</span></div><div id="krerr"></div>`);setTimeout(()=>{krSrc(1);krLint()},0)}
let KRMK={};const KR_SOURCES=[["manual","Manual: I record the readings"],["baselines_jsonl","Analytics history file (automatic)"],["data_js","Analytics snapshot file (automatic)"]];
function krSrc(keep){const src=$("#k_source").value,keys=KRMK[src]||[],man=src==="manual";
 if(!keep)$("#k_metric").innerHTML=keys.map(m=>`<option>${esc(m)}</option>`).join("");
 $("#k_metricwrap").style.display=man||!keys.length?"none":"";
 $("#k_srchint").innerHTML=man?"You type the baseline and target here, then use <b>Record</b> on the key result to log each new reading."
  :keys.length?`Readings are read from <code>${src==="baselines_jsonl"?"baselines-history-v2.jsonl":"data.js"}</code> each time you click <b>Refresh key result values</b>. Pick the metric; baseline fills in from the file if left blank.`
  :`<div class="warn">No metrics found in <code>${src==="baselines_jsonl"?"baselines-history-v2.jsonl":"data.js"}</code>. Set the analytics directory in Settings, or choose Manual.</div>`;
 krLint()}
function krLintVals(){const n=v=>v===""?null:+v;return {title:$("#k_title").value,source:$("#k_source").value,baseline:n($("#k_base").value),target:n($("#k_target").value),direction:$("#k_dir").value,unit:$("#k_unit").value}}
function krLintMsgs(k){const w=[];const b=k.baseline,t=k.target;if(b!=null&&t!=null&&!Number.isNaN(b)&&!Number.isNaN(t)){if(t===b)w.push("target equals baseline — nothing to measure");else if(k.direction==="up"&&t<b)w.push("direction is 'higher is better' but target is below baseline");else if(k.direction==="down"&&t>b)w.push("direction is 'lower is better' but target is above baseline")}
 if(k.source==="manual"&&(b==null||t==null))w.push("manual key results need a baseline and a target (required to save)");if(k.title&&!/\d|%/.test(k.title)&&!k.unit)w.push("title has no number, % or unit — is it measurable?");return w}

async function krSave(key,kid){const n=v=>v===""?null:+v;const th=isThemeKey(key);const b={epic_key:th?null:key,theme_id:th?+key.slice(6):null,title:$("#k_title").value,source:$("#k_source").value,metric_key:$("#k_source").value==="manual"?null:$("#k_metric").value,
 baseline:n($("#k_base").value),target:n($("#k_target").value),current:n($("#k_cur").value),direction:$("#k_dir").value,unit:$("#k_unit").value||null,notes:$("#k_notes").value||null,period_id:S.period?S.period.id:null,
 owner:$("#k_owner").value||null,due:$("#k_due").value||null};
 if(!b.title)return $("#krerr").innerHTML=`<div class="err">Title required</div>`;

function runNext(slug){const i=S.initiatives.find(x=>x.slug===slug);if(!i||!i.next)return;const a={...i.next.args};if(i.next.skill==="requirements-accept"&&!a.file){const ej=(i.steps.find(s=>s.id==="generate-epics-and-stories")||{}).evidence.find(e=>e.kind==="epics-json");if(ej)a.file=ej.path}skill(i.next.skill,a)}
function evLink(e){const label=e.kind==="prd"?"PRD":e.kind;const name=(e.path||"").split("/").pop();if(e.table==="prds"&&e.id)return `<a href="#" onclick="prdView(${e.id});return false" title="${esc(e.path)}">${esc(label)} · ${esc(name)}</a>`;if(e.id&&e.table!=="prds")return `<a href="#" onclick="artView(${e.id});return false" title="${esc(e.path)}">${esc(label)} · ${esc(name)}${e.result?" — "+esc(e.result):""}</a>`;if((e.path||"").startsWith("http"))return `<a href="${esc(e.path)}" target="_blank">${esc(label)} · ${esc(e.path)}</a>`;return `<span>${esc(label)} · ${esc(e.path||"")}</span>`}

 ${Object.keys(i.prd_meta).length?`<div class="meta" style="margin-top:4px">${Object.entries(i.prd_meta).map(([k,v])=>`<span>${esc(k.replace(/_/g," "))}: <b>${esc(v)}</b></span>`).join("")}</div>`:""}
 <div class="row" style="margin-top:8px"><span class="small mute">Owner</span><input type="text" value="${esc(i.owner||"")}" placeholder="PM / DRI" style="max-width:160px" onchange="api('PUT','/api/initiatives/${i.slug}',{owner:this.value}).then(()=>load().then(()=>openJourney('${i.slug}')))"><span class="small mute">Target period</span><select class="f" style="width:auto" onchange="api('PUT','/api/initiatives/${i.slug}',{target_period_id:+this.value}).then(()=>load().then(()=>openJourney('${i.slug}')))"><option value="0">–</option>${S.periods.map(p=>`<option value="${p.id}" ${i.target_period_id===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>
 ${i.next?`<div class="warn" style="margin-top:10px">Next: <b>${esc(i.next.skill)}</b> <button class="ai small" onclick="runNext('${i.slug}')">Run</button> <button class="small" onclick="navigator.clipboard.writeText(${JSON.stringify(i.next.shell)});toast('Copied')">Copy command</button></div>`:""}
 <div style="margin-top:10px">${i.steps.map(s=>`<div class="steprow">${chip(s)}<div><b>${esc(s.label)}</b><div class="small mute">${PHASE[s.phase]||s.phase} · ${s.status}${s.required||s.status==="optional"?"":" · optional"}${s.note?` · ${esc(s.note)}`:""}</div></div><div class="ev">${s.evidence.map(evLink).join("")||`<span class="mute small">no artifact found</span>`}</div>
  <div class="actions">${s.status!=="done"&&s.id!=="poc"?`<button class="ai small" title="Run ${s.id}" onclick="skill('${s.id}',stepArgs('${i.slug}','${s.id}'))">run</button>`:""}${s.status!=="done"&&s.status!=="skipped"?`<button class="small" title="Mark this step skipped with a reason" onclick="skipStep('${i.slug}','${s.id}')">skip</button>`:(s.status==="skipped"&&i.skipped[s.id]?`<button class="small" onclick="api('PUT','/api/initiatives/${i.slug}',{skip:{'${s.id}':''}}).then(()=>load().then(()=>openJourney('${i.slug}')))">unskip</button>`:"")}</div></div>`).join("")}</div>

function stepArgs(slug,step){const i=S.initiatives.find(x=>x.slug===slug);const a={...((i.next&&i.next.skill===step)?i.next.args:{})};if(!a.file){const prd=(i.steps.find(s=>s.id==="generate-prd")||{}).evidence[0];const hld=(i.steps.find(s=>s.id==="generate-hld")||{}).evidence.find(e=>e.kind==="hld");a.file=step==="validate-hld"?(hld||{}).path||"":(prd||{}).path||"";a.bepic=i.bepic_key||"";if(step==="publish-specs")a.files=[a.file,(hld||{}).path].filter(Boolean);if(step==="pm-guide")a.text="--initiative "+slug;if(step==="requirements-accept"){const ej=(i.steps.find(s=>s.id==="generate-epics-and-stories")||{}).evidence.find(e=>e.kind==="epics-json");a.file=(ej||{}).path||""}}return a}

function rRetros(){const rs=S.retros.filter(r=>RF==="all"||r.status===RF||(RF==="pending"&&r.status==="in_progress"));const cnt=s=>S.retros.filter(r=>r.status===s).length;

 ${d.context.length?`<table><tbody>${d.context.map(c=>`<tr><td>${esc(c.metric)}</td><td class="small">${fmt(c.before)} <span class="mute">(${c.before_date||"–"})</span></td><td>→</td><td class="small">${fmt(c.after)} <span class="mute">(${c.after_date||"–"})</span></td><td><b>${c.delta==null?"–":(c.delta>0?"+":"")+fmt(c.delta)}</b></td></tr>`).join("")}</tbody></table>`:""}

async function retroSave(key,done){const o={};new FormData($("#rf")).forEach((v,k)=>o[k]=v);if(done)o.status="done";else if(S.retros.find(r=>r.epic_key===key)?.status==="pending")o.status="in_progress";

async function retroDraft(key){const r=await aiPromise("retro_summary",{epic_key:key});if(!r)return;const f=$("#rf");if(!f)return;for(const k of ["what_shipped","impact","learnings"])if(r[k])f.elements[k].value=r[k];if(r.verdict)f.elements.verdict.value=r.verdict;toast("Draft filled in — review, then Save")}

function gateIssues(i){const st=Object.fromEntries(i.steps.map(s=>[s.id,s]));const out=[];
 if(st["validate-prd"].status==="failed")out.push("PRD gate (validate-prd) FAILED — fix the gaps and re-run");
 if(["failed","partial"].includes(st["validate-hld"].status))out.push(`validate-hld ${st["validate-hld"].status==="failed"?"BLOCKED":"requires manual review"}`);
 if(st["publish-specs"].status==="partial")out.push("publish-specs PR open, not merged — Requirements Accept is blocked until the spec PR merges");
 if(st["ux-brief"].required&&st["ux-brief"].status==="missing")out.push("UX brief required by the PRD metadata but missing");
 return out}

 const krIssues=[];Object.entries(S.okr.epics||{}).forEach(([k,o])=>(o.krs||[]).forEach(kr=>{const w=[];if(kr.baseline==null||kr.target==null)w.push("no baseline/target");if(stale(kr.current_at,14))w.push(kr.current_at?"reading "+ago(kr.current_at):"no reading yet");if(w.length)krIssues.push({k,kr,w})}));

 $("#tab-today").innerHTML=`<div class="bar-tools"><h3 style="margin:0">Today</h3><span class="small mute">What needs a PM decision or action, in journey order. Every card links to its tab or drawer.</span><span class="sp"></span><button onclick="reportModal('weekly')">Weekly status .md</button><button onclick="reportModal('readiness')">Journey readiness .md</button></div>
 <div class="grid3">

 ${card("Story readiness",`<div class="row"><span class="${ds&&dr===ds?"ready":"notready"}">${dr}/${ds} stories ready</span><span class="small mute">across ${dorEp.length} checked epic${dorEp.length===1?"":"s"} (heuristics; requirements-accept is authoritative)</span></div>${unchecked.length?`<div class="small mute" style="margin-top:6px">Never checked, initiative past the PRD gate:</div>${unchecked.slice(0,8).map(e=>`<div class="row small" style="padding:1px 0;flex-wrap:nowrap"><a class="key" href="#" onclick="openEpic('${e.ref}');return false">${e.key}</a>${ell(e.summary)}<button class="small" onclick="refreshDor('${e.key}',this)">Check</button></div>`).join("")}${unchecked.length>8?`<div class="small mute">+${unchecked.length-8} more</div>`:""}`:""}`,`<a href="#" class="small" onclick="go('backlog');return false">Backlog</a>`)}

 ${card("Open blockers &amp; risks",openLog.length?openLog.slice(0,10).map(l=>logLine(l,"rToday()")).join("")+(openLog.length>10?`<div class="small mute">+${openLog.length-10} more</div>`:""):none("None open. Record them from an initiative or epic drawer; they also appear in the weekly report."))}
 ${card("Backlog hygiene",`<div class="row"><span class="${gaps.length?"gap":"small mute"}">${gaps.length} NEEDS INFO</span><span class="small mute">${drafts.length} draft${drafts.length===1?"":"s"} not yet in Jira</span></div>${gaps.slice(0,6).map(e=>`<div class="row small" style="padding:1px 0;flex-wrap:nowrap"><a class="key" href="#" onclick="openEpic('${e.ref}');return false">${e.key}</a>${ell(e.summary)}</div>`).join("")}${gaps.length>6?`<div class="small mute">+${gaps.length-6} more</div>`:""}`,`<a href="#" class="small" onclick="F.gap=true;go('backlog');return false">Backlog</a>`)}
 ${card("Retros pending",retros.length?retros.slice(0,8).map(r=>`<div class="row small" style="padding:1px 0;flex-wrap:nowrap"><a class="key" href="#" onclick="openRetro('${r.epic_key}');return false">${r.epic_key}</a>${ell(r.summary||"")}<span class="mute">${r.released_at||""}</span></div>`).join("")+(retros.length>8?`<div class="small mute">+${retros.length-8} more</div>`:""):none("Nothing waiting for a retro."),`<a href="#" class="small" onclick="go('retros');return false">Retros</a>`)}
 ${card("Freshness",fresh.map(([l,iso,fn])=>`<div class="row" style="padding:2px 0"><span style="width:120px">${l}</span><span class="small ${stale(iso,1)?"amber":"mute"}">${iso?ago(iso):"never"}${stale(iso,1)?" · refresh":""}</span><span class="sp"></span><button class="small" onclick="${fn}">Refresh</button></div>`).join("")+`<div class="small mute" style="margin-top:6px">Amber = older than a day.</div>`)}
 </div>`}

 if(kind==="weekly"){const dorEp=S.epics.filter(e=>e.dor);const dr=dorEp.reduce((a,e)=>a+(e.dor.ready||0),0),ds=dorEp.reduce((a,e)=>a+(e.dor.stories||0),0);

 if(kind==="readiness"){return [`# Journey readiness — ${d}`,``,`| Initiative | Parent | Objective | Ready | Blocking step | Next skill |`,`|---|---|---|---|---|---|`,

 const i=I.find(x=>x.slug===slug);if(!i)return "";const t=initTheme(i);const per=S.periods.find(p=>p.id===i.target_period_id);

function reportModal(kind,slug){const md=reportMd(kind,slug);const name={weekly:"weekly-status",readiness:"journey-readiness"}[kind]||("initiative-"+slug);
 modal(`<h3>${{weekly:"Weekly status",readiness:"Journey readiness"}[kind]||"Initiative one-pager"} <span class="small mute">Markdown, built from the data on screen</span></h3><pre style="max-height:55vh">${esc(md)}</pre>
 <div class="row"><button class="pri" onclick="navigator.clipboard.writeText(document.getElementById('repmd').value);toast('Copied markdown')">Copy</button><button onclick="dlMd('${name}')">Download .md</button><button onclick="closeModal()">Close</button></div><textarea id="repmd" style="display:none">${esc(md)}</textarea>`)}
function dlMd(name){const md=$("#repmd").value;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([md],{type:"text/markdown"}));a.download=`${name}-${new Date().toISOString().slice(0,10)}.md`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ---------- Glossary ---------- */
const GLOSSARY=[["Parent / BEpic","Optional Jira issue above epics (an initiative or business epic) that funds and groups the work. Objectives, initiatives and epics can all point to one (Parent / bepic_key). Set parent_project to tell its keys apart from epic keys."],
["Parent Key (portfolio)","portfolio-context.md column naming the parent issue a Priority Tier rolls up to; imported as the objective's parent."],
["Theme / Objective","One row on the Objectives tab. A theme is both a scoring bucket (rank → theme score in the matrix) and an OKR Objective (the outcome statement). Imported from portfolio-context Priority Tiers or created by hand."],
["Initiative","One PM workspace slug (<slug>/checkpoints/, frontmatter, file names). One row on the Journey tab; it ties a PRD, HLD, epics and stories together."],
["PRD","Product requirements document from /pm-generate-prd (prds/). Stage: drafted → reviewed → validated → in-pr → published."],
["Refined PRD","Output of /pm-review-prd (refined-prds/*_refined_*.md). The file validate-prd and generate-epics-and-stories should run on."],
["PRD gate (validate-prd)","Definition-of-Ready gate on the PRD. Writes UX / Legal / HLD-ownership rows into the PRD metadata; FAIL blocks the pipeline."],
["HLD","High-level design from /pm-generate-hld (generated-hlds/HLD_*.md). Marked skipped when PRD metadata says HLD Ownership = Engineering."],
["validate-hld verdicts","APPROVED = done · REQUIRES_MANUAL_REVIEW = partial (an architect must sign off) · BLOCKED = failed."],
["Epics & stories","/pm-generate-epics-and-stories output (epics/*_epics_*.json). Its right-sizing gate keeps stories ≤ 8 points before anything is created in Jira."],
["publish-specs","Optional. One PR (PRD + HLD) to your spec repo (Settings → spec_repo). Counts as done only once the PR is merged. Without a spec repo the step is optional."],
["Requirements Accept","/pm-requirements-accept runs the 7-point story Definition of Ready and creates passing stories in Jira. Step 3 and the only authoritative story gate."],
["Ready","validate-prd PASS + specs merged (when a spec repo is set) + Requirements Accept done. Engineering may pull stories."],
["Story readiness (heuristics)","The Backlog / epic-drawer DoR check reads stories from Jira and applies heuristics (Given/When/Then, five AC categories, persona, points ≤ 8, vague terms, blockers). Indicative only; requirements-accept is authoritative and the only check of AC ↔ success-metric mapping."],
["Toggle Status / Backout Strategy","Epic-description conventions the DoR expects: how the feature is flagged when deployed and how it is rolled back."],
["UX::Required / Legal::Required","Story labels added by generate-epics-and-stories when the PRD gate detected UX or Legal involvement. The epic DoR check expects them."],
["Key Result","Metric on an epic: baseline → current → target, direction, unit, owner, due. Progress = clamp((current−baseline)/(target−baseline)). Owner and due stay in the workbench; the Jira Outcome block carries metric, baseline and target only."],
["Health","ahead / on track / behind vs time elapsed in the quarter (±15 pts); unmeasured when no KR has a reading; released · measuring for KR-bearing epics closed < 90 days."]];
function glossary(){modal(`<h3>Glossary <span class="small mute">PM Journey terms as used here</span></h3>${GLOSSARY.map(([t,d])=>`<div style="padding:6px 0;border-top:1px dashed var(--line)"><b>${esc(t)}</b><div class="small">${esc(d)}</div></div>`).join("")}<div class="row" style="margin-top:12px"><button onclick="closeModal()">Close</button></div>`)}

/* ---------- Settings ---------- */
function rSettings(){const c=S.config,p=S.params;const j=(k)=>esc(typeof c[k]==="object"?JSON.stringify(c[k]):c[k]??"");
 $("#tab-settings").innerHTML=`<div class="card" id="setupcard"><h3 style="margin-top:0">Setup</h3><div class="small mute">Checks every prerequisite of the PM journey. Red rows show what to run.</div><div id="setupchecks" class="small mute" style="margin-top:8px">checking…</div>
 <div class="row" style="margin-top:8px"><button onclick="busy(this,api('POST','/api/setup/workspace')).then(r=>{renderSetup();toast('Workspace ready: '+r.workspace)}).catch(e=>toast(e.message,1))">Create workspace</button><span class="small mute">Creates the workspace folders, portfolio-context.md and the /pm-* skills.</span></div>
 <h4>Team lookup (optional)</h4><div class="row"><input type="text" id="teamq" placeholder="team name, e.g. Checkout" style="max-width:320px" onkeydown="if(event.key==='Enter')teamLookup()"><button onclick="teamLookup()">Search Jira</button><span class="small mute">For Jira team fields (Advanced Roadmaps): JQL matches teams by id — pick from the results.</span></div><div id="teamres" class="small" style="margin-top:6px"></div>
 <h4>Portfolio context</h4><div class="row"><button onclick="busy(this,api('POST','/api/setup/import-portfolio')).then(r=>{load();toast('Created '+r.created+' objectives (themes) from '+r.tiers+' tiers')}).catch(e=>toast(e.message,1))">Import Priority Tiers as objectives</button><span class="small mute">Reads <kbd>portfolio-context.md</kbd> from your PM workspace (initiative → theme, Parent Key → parent issue).</span></div></div>
 <div class="grid2"><div class="card"><h3 style="margin-top:0">Install config</h3><div class="small mute">Stored in data/config.json (never shared). Each PM sets their own Jira project, fields and owner.</div>
 ${[["jira_base","Jira base URL"],["jira_email","Atlassian email (Jira Cloud only; empty = Server/DC PAT)"],["jira_project","Jira project key (epics)"],["parent_project","Parent project key (optional: initiatives / business epics)"],["epic_jql","Custom epic JQL (optional; overrides project / teams)"],["jira_fields","Jira field ids (JSON: parent_link, outcome, acceptance_criteria, story_points, product_owner, portfolio_team)"],["portfolio_team_ids","Team ids → names (JSON, optional)"],["jira_plan_url","Jira plan / roadmap URL (header link)"],["default_product_owner","Default Product Owner (Jira username / account id)"],["default_labels","Default labels on new epics (JSON list)"],["jira_pat_file","Jira token file (optional; default data/.env)"],["prd_dirs","Extra PRD directories (JSON list; workspace prds/ + refined-prds/ are always scanned)"],["pr_workspace","PM workspace (default ~/pm-workspace)"],["poll_minutes","Jira poll interval (minutes, 0=off)"],["spec_repo","Spec repo for publish-specs (optional, owner/repo)"],["spec_path","Folder in the spec repo"],["github_pr_authors","PR authors to scan (JSON list, @me = you)"],["github_prs","Pinned PR numbers to always include (JSON list)"],["poc_repo","Prototype repo (optional, owner/repo)"]].map(([k,l])=>`<label class="f">${l}</label><input type="text" id="c_${k}" value="${j(k)}">`).join("")}
 <h4>Claude</h4><label class="f">Mode</label><select class="f" id="c_claude_mode">${["personal","off"].map(m=>`<option ${c.claude_mode===m?"selected":""}>${m}</option>`).join("")}</select>
 <div class="small mute">personal = your Claude Code login · off = every AI button disabled</div>
 <label class="f">Haiku model for extract/cluster/draft</label><input type="text" id="c_haiku_model" value="${j("haiku_model")}">
 <div class="row" style="margin-top:12px"><button class="pri" onclick="saveCfg()">Save config</button><span id="patst" class="small mute"></span></div></div>
 <div><div class="card"><h3 style="margin-top:0">Scoring parameters</h3>
 ${[["w_sv","Weight: Strategic Value"],["w_ui","Weight: User Impact"],["w_urg","Weight: Urgency"],["w_theme","Weight: Theme Priority"],["w_conf","Weight: Confidence"],["w_val","Weight: Validation (evidence)"],["effort_S","Effort factor S"],["effort_M","Effort factor M"],["effort_L","Effort factor L"],["band_p1","Band: P1 top fraction"],["band_p2","Band: P2 cumulative"],["band_p3","Band: P3 cumulative"],["conf_gap","Confidence gap threshold (≤)"]].map(([k,l])=>`<div class="row" style="justify-content:space-between;padding:3px 0"><span>${l}</span><input type="text" id="p_${k}" value="${p[k]}" style="width:90px"></div>`).join("")}
 <div class="small mute" style="margin-top:6px">The six weights must sum to 1.0. Validation is ${p.w_val?"on":"off (0)"}; ${p.w_val?"":`<a href="#" onclick="for(const [k,v] of Object.entries({w_sv:.25,w_ui:.20,w_urg:.15,w_theme:.15,w_conf:.10,w_val:.15}))$('#p_'+k).value=v;return false">apply the suggested rebalance</a> (SV .25, UI .20, Urgency .15, Theme .15, Confidence .10, Validation .15), then save.`}</div>
 <h4>Validation points per source type</h4><div class="small mute">Each distinct type present adds its points to a base of 1; repeats add +0.25 each up to +0.5; ceiling 5. Competitor-only is capped at 1.5.</div>
 ${S.evidence_types.map(t=>`<div class="row" style="justify-content:space-between;padding:3px 0"><span>${esc(t.label)}</span><input type="text" id="p_val_w_${t.key}" value="${p["val_w_"+t.key]}" style="width:90px"></div>`).join("")}
 <div class="row" style="margin-top:12px"><button class="pri" onclick="saveParams()">Save parameters</button></div></div>
 <div class="card"><h3 style="margin-top:0">OKR periods</h3><div class="small mute">Quarters. KRs belong to a period; themes persist across periods.</div>
 ${S.periods.map(p=>`<div class="row" style="margin-top:6px"><input type="text" value="${esc(p.name)}" style="width:110px" id="pn_${p.id}"><input type="text" value="${p.start}" style="width:110px" id="ps_${p.id}"><input type="text" value="${p.end}" style="width:110px" id="pe_${p.id}"><button class="small" onclick="api('PUT','/api/periods',{id:${p.id},name:$('#pn_${p.id}').value,start:$('#ps_${p.id}').value,end:$('#pe_${p.id}').value}).then(load)">Save</button>${S.period&&S.period.id===p.id?'<span class="small mute">current</span>':`<button class="small" onclick="api('PUT','/api/periods/current/${p.id}').then(load)">make current</button>`}</div>`).join("")}
 <div class="row" style="margin-top:8px"><input type="text" id="pn_new" placeholder="Q1 2028" style="width:110px"><input type="text" id="ps_new" placeholder="2028-01-01" style="width:110px"><input type="text" id="pe_new" placeholder="2028-03-31" style="width:110px"><button class="small" onclick="api('PUT','/api/periods',{name:$('#pn_new').value,start:$('#ps_new').value,end:$('#pe_new').value}).then(load)">Add</button></div>
 <label class="f">Analytics directory (KR metric sources: baselines-history-v2.jsonl, data.js)</label><input type="text" id="c_analytics_dir" value="${j("analytics_dir")}" placeholder="optional"><button class="small" style="margin-top:6px" onclick="api('PUT','/api/config',{analytics_dir:$('#c_analytics_dir').value}).then(()=>{MK=null;load();toast('Saved')})">Save</button></div>
 <div class="card"><h3 style="margin-top:0">Data</h3><div class="row"><a class="btn" href="/api/export/json">Export JSON (themes, scores, ideas)</a><label class="btn">Import JSON<input type="file" accept=".json" style="display:none" onchange="importJson(this.files[0])"></label>
 <label class="btn">Import legacy xlsx<input type="file" accept=".xlsx" style="display:none" onchange="importXlsx(this.files[0])"></label></div>
 <div class="small mute" style="margin-top:6px">Imported from ${esc(S.meta.imported_from||"–")} at ${esc(S.meta.imported_at||"–")}</div></div>
 <div class="card"><h3 style="margin-top:0">AI runs</h3><table><tbody>${S.ai_runs.map(r=>`<tr><td class="small mute">${esc(r.started)}</td><td>${esc(r.kind)}</td><td class="small">${esc(r.model)} · ${esc(r.account)}</td><td class="small">${esc(r.status)}</td><td class="small mute">${r.est_input_tokens?"~"+r.est_input_tokens+" tok":""} ${esc((r.log||"").slice(0,80))}</td></tr>`).join("")||`<tr><td class="mute">none yet</td></tr>`}</tbody></table></div></div></div>`;
 api("GET","/api/jira/status").then(r=>$("#patst").textContent=r.pat?"Jira token: found":"Jira token: missing ("+r.sources+")");renderSetup()}
async function renderSetup(){try{const r=await api("GET","/api/setup/status");$("#setupchecks").innerHTML=`<table><tbody>${r.checks.map(c=>`<tr><td style="width:24px">${c.ok?'<span style="color:var(--ok)">✓</span>':'<span style="color:var(--bad)">✗</span>'}</td><td>${esc(c.label)}</td><td class="mute">${c.ok?"":esc(c.fix)}</td></tr>`).join("")}</tbody></table>`}catch(e){$("#setupchecks").innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function teamLookup(){const q=$("#teamq").value.trim();$("#teamres").textContent="searching…";try{const r=await api("GET","/api/jira/teams?q="+encodeURIComponent(q));$("#teamres").innerHTML=r.length?r.map(t=>`<div class="row" style="padding:2px 0"><kbd>${esc(t.id)}</kbd> ${esc(t.name)} <button class="small" onclick="addTeam('${esc(t.id)}','${esc(t.name).replace(/'/g,"\\'")}')">Add</button></div>`).join(""):'<span class="mute">no matches</span>'}catch(e){$("#teamres").innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function addTeam(id,name){const ids={...(S.config.portfolio_team_ids||{})};ids[id]=name;try{await api("PUT","/api/config",{portfolio_team_ids:ids});await load();toast("Team added: "+name+". Pull from Jira to load its epics.")}catch(e){toast(e.message,1)}}
async function importXlsx(f){if(!f||!confirm("Import scores, themes and weights from this xlsx? Overwrites current inputs for matching epics."))return;const fd=new FormData();fd.append("file",f);try{const r=await api("POST","/api/import/xlsx",fd);await load();toast("Imported "+r.epics+" epics, "+r.themes+" themes")}catch(e){toast(e.message,1)}}
async function saveCfg(){const b={};for(const k of ["jira_base","jira_email","jira_project","parent_project","epic_jql","jira_plan_url","default_product_owner","jira_pat_file","pr_workspace","claude_mode","haiku_model","spec_repo","spec_path","poc_repo"])b[k]=$("#c_"+k).value.trim();
 try{for(const k of ["jira_fields","portfolio_team_ids","default_labels","prd_dirs","github_pr_authors","github_prs"])b[k]=JSON.parse($("#c_"+k).value);b.poll_minutes=+$("#c_poll_minutes").value;await api("PUT","/api/config",b);await load();toast("Config saved")}catch(e){toast(e.message,1)}}
async function saveParams(){const b={};document.querySelectorAll("[id^=p_]").forEach(i=>b[i.id.slice(2)]=+i.value);try{await api("PUT","/api/params",b);await load();toast("Parameters saved; backlog re-scored")}catch(e){toast(e.message,1)}}
async function importJson(f){const fd=new FormData();fd.append("file",f);try{const r=await api("POST","/api/import/json",fd);await load();toast(`Imported ${r.imported} records`)}catch(e){toast(e.message,1)}}

load().catch(e=>{document.body.insertAdjacentHTML("beforeend",`<div class="err" style="margin:20px">${esc(e.message)}</div>`)});
setInterval(()=>{const a=document.activeElement;if($("#overlay").innerHTML||(a&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName))||(a&&a.isContentEditable))return;load()},60000);
setInterval(()=>{const a=document.activeElement;if(!S||!S.skills_running||$("#overlay").innerHTML||(a&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName)))return;load()},10000);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#overlay").innerHTML)closeModal()});
</script>
</body>
